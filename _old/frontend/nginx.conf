server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Проксі для API бекенду
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Для завантаження файлів (великі тіла)
        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Проксі для статичних зображень з бекенду (/images/products/, /images/users/, /images/chains/)
    location ^~ /images/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health check бекенду
    location /health {
        proxy_pass http://backend:3000/health;
    }

    # SPA fallback — всі інші запити на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кешування статики фронтенду
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
