services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: best-buy-planner-db
    environment:
      POSTGRES_DB: best_buy_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bbp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d best_buy_planner"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: best-buy-planner-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@db:5432/best_buy_planner"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - images_data:/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bbp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: best-buy-planner-frontend
    ports:
      - "20004:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bbp-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  images_data:
    driver: local

networks:
  bbp-network:
    driver: bridge
