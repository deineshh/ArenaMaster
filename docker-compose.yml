services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: arenamaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arenamaster"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./ArenaMaster.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      DATABASE_URL: Host=db;Database=arenamaster;Username=postgres;Password=postgres
      JWT_SECRET: your-very-long-secret-key-here-min-32-chars
      JWT_ISSUER: arenamaster.ua
      JWT_AUDIENCE: arenamaster.ua
      FRONTEND_URL: http://localhost:5173
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ArenaMaster.Api/uploads:/app/uploads

  client:
    build:
      context: ./arena-master-client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_PROXY_URL: http://api:8080
    volumes:
      - ./arena-master-client/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:
